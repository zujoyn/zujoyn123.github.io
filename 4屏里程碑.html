  body::after{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(78% 62% at 50% 46%,
      rgba(255,255,255,.38) 0%, rgba(255,255,255,.12) 58%, rgba(255,255,255,0) 100%);
  }

  .page{position:relative;z-index:1;max-width:1680px;margin:0 auto;padding:56px clamp(20px,4vw,72px) 44px;}

  /* ---------- 页头 ---------- */
  .eyebrow{
    display:inline-block;margin:0 0 16px;padding:5px 14px;border-radius:999px;
    background:rgba(46,158,143,.10);color:var(--green);
    font-size:13px;font-weight:500;letter-spacing:.14em;
  }
  h1{
    margin:0;font-size:clamp(30px,4vw,54px);font-weight:800;letter-spacing:-.02em;
    line-height:1.15;color:var(--ink);
  }
  h1 .hl{
    background:linear-gradient(180deg,transparent 62%,rgba(79,183,158,.34) 62%);
    padding:0 2px;
  }
  .lede{margin:16px 0 0;font-size:clamp(14px,1.15vw,18px);color:var(--ink-2);line-height:1.75;max-width:60ch;}
  .head{opacity:0;transform:translateY(10px);animation:rise .7s cubic-bezier(.2,.7,.3,1) .05s forwards;}

  /* ---------- 横向丝带舞台 ---------- */
  .stage-wrap{margin-top:clamp(10px,1.6vw,26px);overflow-x:auto;overflow-y:hidden;}
  .stage{
    position:relative;width:100%;min-width:1180px;aspect-ratio:1600/760;
    container-type:inline-size;
  }
  .ribbon-svg{position:absolute;inset:0;width:100%;height:100%;display:block;}

  .label{
    position:absolute;width:18%;transform:translateX(-50%);
    text-align:center;cursor:default;
    opacity:0;
  }
  .label.up{top:21.5%;}
  .label.down{top:71%;}
  .label .yr{
    display:block;font-size:40px;font-size:2.7cqw;font-weight:800;line-height:1.06;
    color:var(--green);letter-spacing:-.01em;font-variant-numeric:tabular-nums;
  }
  .label .ttl{
    display:block;margin-top:.28em;font-size:16px;font-size:1.1cqw;font-weight:700;

        <defs>
          <!-- 笔触的色阶：主笔触 / 上缘高光 / 下缘积料 -->
          <linearGradient id="ribbonBody" x1="0" y1="0" x2="0" y2="1">

<script>
(function(){
  var DATA = [
    { year:'2019.9',  title:'上升为重大国家战略',
      text:'黄河流域生态保护和高质量发展座谈会在河南郑州召开',
      x:200,  side:'up' },
    { year:'2021.10', title:'规划纲要印发',
      text:'中共中央、国务院印发《黄河流域生态保护和高质量发展规划纲要》',
      x:495,  side:'down' },
    { year:'2023.4',  title:'黄河保护法施行',
      text:'我国第二部流域专门法律，以法律形式确立生态保护补偿制度',
      x:795,  side:'up' },
    { year:'2025.5',  title:'横向补偿机制健全',
      text:'五部门出台健全横向生态保护补偿机制意见，干流及重要支流全覆盖',
      x:1115, side:'down' },
    { year:'2025.9',  title:'干流补偿全域贯通',
      text:'豫晋陕签署横向生态保护补偿协议，沿黄省份累计签订 9 份跨省协议',
      x:1440, side:'up' }
  ];

  var SVGNS = 'http://www.w3.org/2000/svg';
  var stage   = document.getElementById('stage');
  var brush   = document.getElementById('brush');
  var leaders = document.getElementById('leaders');
  var dotsG   = document.getElementById('dots');
  var labelsG = document.getElementById('labels');
  var VW = 1600, VH = 760;

  /* ---- 1. 一笔颜料：同一路径叠四层笔触，用手绘质感代替平涂 ---- */
  var RIVER_D = 'M -60,468 C 30,468 70,420 150,406 ' +
                'C 240,388 300,392 380,414 C 450,432 480,470 560,480 ' +
                'C 640,490 690,494 770,487 C 850,480 890,444 970,426 ' +
                'C 1040,410 1100,398 1180,396 C 1260,394 1300,406 1380,426 ' +
                'C 1440,442 1500,468 1580,476 C 1640,481 1670,480 1700,476';

  var STROKES = [
    { paint:'url(#ribbonBody)', w:72, op:.34, filter:'url(#paintB)', dx:0,  dy:8   },
    { paint:'url(#ribbonBody)', w:56, op:1,   filter:'url(#paintA)', dx:0,  dy:0, id:'ribbon' },
    { paint:'url(#ribbonDeep)', w:46, op:.80, filter:'url(#paintB)', dx:0,  dy:11  },
    { paint:'url(#ribbonHi)',   w:18, op:.92, filter:'url(#paintC)', dx:-3, dy:-13 }
  ];
  STROKES.forEach(function(st){
    var p = document.createElementNS(SVGNS, 'path');
    p.setAttribute('d', RIVER_D);
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', st.paint);
    p.setAttribute('stroke-width', st.w);
    p.setAttribute('stroke-linecap', 'round');
    p.setAttribute('filter', st.filter);
    if (st.op !== 1) p.setAttribute('opacity', st.op);
    if (st.dx || st.dy) p.setAttribute('transform', 'translate(' + st.dx + ' ' + st.dy + ')');
    if (st.id) p.setAttribute('id', st.id);
    brush.appendChild(p);
  });
  var ribbon = document.getElementById('ribbon');

  /* ---- 2. 沿路径按目标 x 定位节点（保证点一定落在丝带上） ---- */
  var total = ribbon.getTotalLength();
  function pointAtX(targetX){
    var lo = 0, hi = total, mid, p;
    for (var k = 0; k < 42; k++){
      mid = (lo + hi) / 2;
      p = ribbon.getPointAtLength(mid);
      if (p.x < targetX) lo = mid; else hi = mid;
    }
    return ribbon.getPointAtLength((lo + hi) / 2);
  }

  var labelEls = [];
  DATA.forEach(function(d, idx){
    var p = pointAtX(d.x);
    d.px = p.x; d.py = p.y;

    var dot = document.createElementNS(SVGNS, 'circle');
    dot.setAttribute('cx', p.x.toFixed(1));
    dot.setAttribute('cy', p.y.toFixed(1));
    dot.setAttribute('r', '11');
    dot.setAttribute('fill', '#ffffff');
    dot.setAttribute('stroke', '#2E9E8F');
    dot.setAttribute('stroke-width', '3.6');
    dot.setAttribute('class', 'node');
    dot.setAttribute('style', 'opacity:0;transition:opacity .5s ease ' + (0.12 + idx*0.1) + 's, r .25s ease;');
    dotsG.appendChild(dot);
    d.dot = dot;

    /* 引线：白色描边垫底 + 有色细线，压在照片背景上也看得清 */
    var halo = document.createElementNS(SVGNS, 'line');
    halo.setAttribute('stroke', '#FFFFFF');
    halo.setAttribute('stroke-width', '5.5');
    halo.setAttribute('stroke-linecap', 'round');
    halo.setAttribute('style', 'opacity:0;transition:opacity .5s ease ' + (0.3 + idx*0.1) + 's;');
    leaders.appendChild(halo);

    var line = document.createElementNS(SVGNS, 'line');
    line.setAttribute('stroke', '#4F8577');
    line.setAttribute('stroke-width', '2.2');
    line.setAttribute('stroke-linecap', 'round');
    line.setAttribute('x1', p.x.toFixed(1));
    line.setAttribute('x2', p.x.toFixed(1));
    line.setAttribute('y1', p.y.toFixed(1));
    line.setAttribute('y2', p.y.toFixed(1));
    line.setAttribute('style', 'opacity:0;transition:opacity .5s ease ' + (0.3 + idx*0.1) + 's;');
    leaders.appendChild(line);
    d.line = line; d.halo = halo;

    var el = document.createElement('div');
    el.className = 'label ' + d.side + (idx === 0 ? ' first' : '') + (idx === DATA.length - 1 ? ' last' : '');
    el.style.left = (p.x / VW * 100).toFixed(3) + '%';
    /* 首末节点在嵌入模式下向内收，避免文字超出舞台被裁 */
    var _n = DATA.length - 1;
    if(idx === 0) el.style.setProperty('transform', 'translateX(-34%)', 'important');
    if(idx === _n) el.style.setProperty('transform', 'translateX(-66%)', 'important');
    el.innerHTML =
      '<span class="yr">' + d.year + '</span>' +
      '<span class="ttl">' + d.title + '</span>' +
      '<span class="txt">' + d.text + '</span>';

    (function(dd){
      el.addEventListener('mouseenter', function(){
        dd.dot.setAttribute('r', '14');
        dd.dot.setAttribute('stroke', '#136054');
        dd.dot.setAttribute('stroke-width', '4.5');
        el.classList.add('is-hot');
        drawLeaders();
      });
      el.addEventListener('mouseleave', function(){
        dd.dot.setAttribute('r', '11');
        dd.dot.setAttribute('stroke', '#2E9E8F');
        dd.dot.setAttribute('stroke-width', '3.6');
        el.classList.remove('is-hot');
        drawLeaders();
      });
    })(d);

    labelsG.appendChild(el);
    labelEls.push(el);
  });

  /* ---- 3. 引线：从标签边缘连到节点 ---- */
  function drawLeaders(){
    var sr = stage.getBoundingClientRect();
    if (!sr.width) return;
    var s = sr.width / VW;
    DATA.forEach(function(d){
      var r = labelEls[DATA.indexOf(d)].getBoundingClientRect();
      var topSvg = (r.top - sr.top) / s;
      var botSvg = (r.bottom - sr.top) / s;
      var y1, y2;
      if (d.side === 'up'){
        y1 = Math.min(botSvg + 6, d.py - 22);
        y2 = d.py - 16;
      } else {
        y1 = Math.max(topSvg - 6, d.py + 22);
        y2 = d.py + 16;
      }
      [d.line, d.halo].forEach(function(n){
        n.setAttribute('x1', d.px.toFixed(1));
        n.setAttribute('x2', d.px.toFixed(1));
        n.setAttribute('y1', y1.toFixed(1));
        n.setAttribute('y2', y2.toFixed(1));
      });
    });
  }

  /* ---- 4. 竖向时间轴（小屏） ---- */
  var vtl = document.getElementById('vtl');
  DATA.forEach(function(d){
    var li = document.createElement('li');
    li.innerHTML = '<span class="dot"></span>' +
      '<div class="yr">' + d.year + '</div>' +
      '<div class="ttl">' + d.title + '</div>' +
      '<div class="txt">' + d.text + '</div>';
    vtl.appendChild(li);
  });

  /* ---- 5. 入场 + 自适应重算 ---- */
  function reveal(){
    drawLeaders();
    requestAnimationFrame(function(){
      stage.classList.add('in');
      DATA.forEach(function(d){
        d.dot.style.opacity = '1';
        d.line.style.opacity = '1';
        if (d.halo) d.halo.style.opacity = '.62';
      });
    });
  }

  if (document.fonts && document.fonts.ready){ document.fonts.ready.then(reveal); }
  else { window.addEventListener('load', reveal); }
  setTimeout(reveal, 600);

  var raf;
  window.addEventListener('resize', function(){
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(drawLeaders);
  });
  if (window.ResizeObserver){ new ResizeObserver(drawLeaders).observe(stage); }
})();
</script>

<script>
/* embed 模式：把真实内容高度上报给父页面，父页面据此调整 iframe 高度 */
(function(){
  if(!/body/.test('x')) return;
  function report(){
    if(!document.body.classList.contains('embed')) return;
    var st = document.querySelector('.stage');
    if(!st) return;
    var top = Infinity, bot = 0;
    document.querySelectorAll('.label').forEach(function(l){
      var r = l.getBoundingClientRect();
      if(r.height < 2) return;
      top = Math.min(top, r.top);
      bot = Math.max(bot, r.bottom);
    });
    if(bot <= 0 || !isFinite(top)) return;
    var stRect = st.getBoundingClientRect();
    // 内容超出 stage 的上下量
    var up = Math.max(0, stRect.top - top);
    var down = Math.max(0, bot - stRect.bottom);
    var need = Math.ceil(stRect.height + up + down + 4);
    if(window.parent !== window){
      window.parent.postMessage({type:'milestone-height', h: need}, '*');
    }
  }
  window.addEventListener('load', function(){ setTimeout(report, 300); });
  if(window.ResizeObserver){
    var st0 = document.querySelector('.stage');
    if(st0) new ResizeObserver(function(){ setTimeout(report, 60); }).observe(st0);
  }
})();
</script>
